x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: app

services:
  app:
    build: *app-build
    image: nusantara-app:latest
    container_name: nusantara_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - app_uploads:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.75
    logging: *app-logging

  queue:
    build: *app-build
    image: nusantara-app:latest
    container_name: nusantara_queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    entrypoint: ["docker-entrypoint-worker.sh"]
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--sleep=3",
        "--tries=3",
        "--backoff=5",
        "--max-time=3600",
        "--max-jobs=1000",
      ]
    volumes:
      - app_uploads:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - laravel
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q queue:work /proc/1/cmdline",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *app-logging

  scheduler:
    build: *app-build
    image: nusantara-app:latest
    container_name: nusantara_scheduler
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    entrypoint: ["docker-entrypoint-worker.sh"]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_uploads:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - laravel
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # No healthcheck — scheduler is just artisan schedule:work, no listening socket.
    # Override the image's FPM healthcheck so the container doesn't report unhealthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q schedule:work /proc/1/cmdline",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *app-logging

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: nusantara-web:latest
    container_name: nusantara_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Periodically reload to pick up renewed certs (no-op if config unchanged)
    command:
      - /bin/sh
      - -c
      - |
        ( while :; do sleep 6h & wait $${!}; nginx -s reload 2>/dev/null || true; done ) &
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/var/www/storage/app/public:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - laravel
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.25
    logging: *app-logging

  certbot:
    image: certbot/certbot:latest
    container_name: nusantara_certbot
    restart: unless-stopped
    # Try renewal every 12h; cert is reissued at ~30 days remaining
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet --no-random-sleep-on-renew
          sleep 12h & wait $${!}
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - laravel
    mem_limit: 64m
    cpus: 0.1
    logging: *app-logging

  db:
    image: mysql:8.0
    container_name: nusantara_db
    restart: unless-stopped
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=caching_sha2_password",
        "--innodb-buffer-pool-size=256M",
        "--max-connections=50",
        "--performance-schema=OFF",
      ]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nusantara_pangkas}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    logging: *app-logging

  redis:
    image: redis:7-alpine
    container_name: nusantara_redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redisdata:/data
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 0.5
    logging: *app-logging

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  app_uploads:
  letsencrypt:
  certbot_webroot:
