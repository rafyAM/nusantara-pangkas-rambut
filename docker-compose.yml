services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusantara_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - laravel
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: nusantara_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M

  db:
    image: mysql:8.0
    container_name: nusantara_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nusantara_pangkas}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:alpine
    container_name: nusantara_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - laravel
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  laravel:

volumes:
  dbdata: